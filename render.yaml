services:
  - type: web
    name: hearth
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HEARTH_DB
        value: /tmp/hearth.db
      - key: CAPTURE_MODE
        value: mock
      - key: NODE_ENV
        value: production
